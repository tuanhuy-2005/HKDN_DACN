name: tuanhuy-cafe

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: cafe_db
      MARIADB_USER: cafe_user
      MARIADB_PASSWORD: cafe_pass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema/cafe_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: cafe-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=cafe_db
      - DB_USER=cafe_user
      - DB_PASS=cafe_pass
      - DB_CHARSET=utf8mb4
      - JWT_SECRET=super_secret_key_for_cafe_management_system_development_12345
      - JWT_ISSUER=cafe-api
      - JWT_TTL_SECONDS=86400
      - CORS_ORIGINS=http://localhost:8088,http://127.0.0.1:8088
    volumes:
      - backend-storage:/app/storage
      - backend-uploads:/app/public/uploads

  frontend:
    image: cafe-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "8088:3000"
    depends_on:
      - backend

volumes:
  db-data:
    external: true
    name: cafe-management_db-data
  backend-storage:
  backend-uploads:
